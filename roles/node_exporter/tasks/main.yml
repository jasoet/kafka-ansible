---
- name: Create node_exporter group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create node_exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ node_exporter_install_dir }}"
    create_home: false
    state: present

- name: Create Node exporter install directory
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: "0755"

- name: Check if Node exporter is already installed
  ansible.builtin.stat:
    path: "{{ node_exporter_install_dir }}/node_exporter"
  register: node_exporter_installed

- name: Download Node exporter
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "/tmp/node_exporter.tar.gz"
    mode: "0644"
    timeout: 120
  register: node_exporter_download_result
  retries: 3
  delay: 5
  until: node_exporter_download_result is succeeded
  when: not node_exporter_installed.stat.exists

- name: Extract Node exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter.tar.gz"
    dest: "{{ node_exporter_install_dir }}"
    remote_src: true
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    extra_opts:
      - --strip-components=1
  when: not node_exporter_installed.stat.exists

- name: Clean up downloaded tarball
  ansible.builtin.file:
    path: "/tmp/node_exporter.tar.gz"
    state: absent

- name: Deploy Node exporter systemd service
  ansible.builtin.template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start Node exporter service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
