---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: kafka-exp-test
    image: ubuntu:24.04
    privileged: true
    command: /sbin/init
    systemd: true
    groups:
      - kafka

provisioner:
  name: ansible
  inventory:
    group_vars:
      kafka:
        kafka_quorum_voters: "1@kafka-exp-test:9093"
    host_vars:
      kafka-exp-test:
        kafka_node_id: 1

verifier:
  name: ansible
