---
# Disk mount role - idempotent disk formatting and mounting

- name: Initialize variables
  ansible.builtin.set_fact:
    disk_mount_already_mounted: false

- name: Install filesystem tools
  ansible.builtin.apt:
    name:
      - xfsprogs
      - parted
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check if mount path is already mounted
  ansible.builtin.command:
    cmd: "findmnt -n -o SOURCE {{ disk_mount_path }}"
  register: disk_mount_existing_mount
  changed_when: false
  failed_when: false

- name: Use existing mount device if already mounted
  ansible.builtin.set_fact:
    disk_mount_device: "{{ disk_mount_existing_mount.stdout | trim }}"
    disk_mount_already_mounted: true
  when: disk_mount_existing_mount.rc == 0 and disk_mount_existing_mount.stdout | trim != ""

- name: Auto-detect disk device if not specified and not already mounted
  when: disk_mount_device == "" and (disk_mount_existing_mount.rc != 0 or disk_mount_existing_mount.stdout | trim == "")
  block:
    - name: Get list of block devices (JSON)
      ansible.builtin.command:
        cmd: lsblk -po NAME,TYPE,FSTYPE,SIZE --json --bytes
      register: disk_mount_lsblk_output
      changed_when: false

    - name: Find largest unformatted disk (no partitions, no filesystem)
      ansible.builtin.set_fact:
        disk_mount_device: >-
          {{ (disk_mount_lsblk_output.stdout | from_json).blockdevices
             | selectattr('type', 'equalto', 'disk')
             | selectattr('fstype', 'none')
             | rejectattr('children', 'defined')
             | sort(attribute='size', reverse=true)
             | map(attribute='name')
             | first
             | default('') }}

- name: Fail if no disk device available
  ansible.builtin.fail:
    msg: "No disk device specified or detected"
  when: disk_mount_device == ""

- name: Display target disk
  ansible.builtin.debug:
    msg: "Target disk: {{ disk_mount_device }}"

- name: Check if disk has filesystem
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ disk_mount_device }}"
  register: disk_mount_detected_fstype
  changed_when: false
  failed_when: false

- name: Check if disk is mounted
  ansible.builtin.command:
    cmd: "findmnt -n -o TARGET {{ disk_mount_device }}"
  register: disk_mount_mountpoint
  changed_when: false
  failed_when: false

- name: Format disk if unformatted
  when: >
    disk_mount_detected_fstype.stdout == "" or
    (disk_mount_force_format and disk_mount_mountpoint.stdout == "")
  block:
    - name: Create filesystem on disk
      community.general.filesystem:
        dev: "{{ disk_mount_device }}"
        fstype: "{{ disk_mount_fstype }}"
        force: "{{ disk_mount_force_format }}"

- name: Create mount point directory
  ansible.builtin.file:
    path: "{{ disk_mount_path }}"
    state: directory
    mode: "0755"

- name: Check current fstab entry
  ansible.builtin.command:
    cmd: "grep -c '{{ disk_mount_device }}' /etc/fstab"
  register: disk_mount_fstab_check
  changed_when: false
  failed_when: false

- name: Add fstab entry if missing
  ansible.posix.mount:
    path: "{{ disk_mount_path }}"
    src: "{{ disk_mount_device }}"
    fstype: "{{ disk_mount_fstype }}"
    opts: "{{ disk_mount_opts }}"
    state: mounted
  when: disk_mount_fstab_check.stdout == "0" or disk_mount_mountpoint.stdout != disk_mount_path

- name: Ensure disk is mounted
  ansible.posix.mount:
    path: "{{ disk_mount_path }}"
    src: "{{ disk_mount_device }}"
    fstype: "{{ disk_mount_fstype }}"
    opts: "{{ disk_mount_opts }}"
    state: mounted

- name: Check if owner user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ disk_mount_owner }}"
  register: disk_mount_owner_check
  failed_when: false
  when: disk_mount_owner != ""

- name: Set mount point ownership
  ansible.builtin.file:
    path: "{{ disk_mount_path }}"
    owner: "{{ disk_mount_owner }}"
    group: "{{ disk_mount_group }}"
    mode: "{{ disk_mount_mode }}"
    state: directory
  when: disk_mount_owner != "" and disk_mount_owner_check.ansible_facts is defined
