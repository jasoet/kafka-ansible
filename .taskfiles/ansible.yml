version: '3'

vars:
  INVENTORY: '{{.INVENTORY | default "./inventories/production/hosts.yml"}}'

tasks:
  lint:
    desc: Run ansible-lint on roles and playbooks
    cmds:
      - uv run ansible-lint roles/ playbooks/

  ping:
    desc: Ping all hosts in inventory
    cmds:
      - uv run ansible -i {{.INVENTORY}} all -m ping

  facts:
    desc: Gather facts from all hosts
    cmds:
      - uv run ansible -i {{.INVENTORY}} all -m setup

  deploy:
    desc: Deploy Kafka cluster
    cmds:
      - uv run ansible-playbook -i {{.INVENTORY}} playbooks/kafka.yml
    preconditions:
      - test -f {{.INVENTORY}}
      - sh: "test -f {{.INVENTORY}}"
        msg: "Inventory file not found: {{.INVENTORY}}"

  deploy:single:
    desc: "Deploy Kafka to single VM (usage: task ansible:deploy:single -- kafka-test-1)"
    cmds:
      - uv run ansible-playbook -i {{.INVENTORY}} playbooks/kafka.yml --limit {{.CLI_ARGS | default "kafka-test-1"}}
    preconditions:
      - sh: "test -f {{.INVENTORY}}"
        msg: "Inventory file not found: {{.INVENTORY}}"

  verify:
    desc: Verify Kafka cluster deployment
    cmds:
      - uv run ansible-playbook -i {{.INVENTORY}} playbooks/verify.yml
    preconditions:
      - sh: "test -f {{.INVENTORY}}"
        msg: "Inventory file not found: {{.INVENTORY}}"

  verify:single:
    desc: "Verify single VM (usage: task ansible:verify:single -- kafka-test-1)"
    cmds:
      - uv run ansible-playbook -i {{.INVENTORY}} playbooks/verify.yml --limit {{.CLI_ARGS | default "kafka-test-1"}}
    preconditions:
      - sh: "test -f {{.INVENTORY}}"
        msg: "Inventory file not found: {{.INVENTORY}}"

  deploy:prod:
    desc: Deploy to production (requires confirmation)
    vars:
      INVENTORY: ./inventories/production/hosts.yml
    cmds:
      - uv run ansible-playbook -i {{.INVENTORY}} playbooks/kafka.yml
    preconditions:
      - sh: "test -f {{.INVENTORY}}"
        msg: "Production inventory not found: {{.INVENTORY}}"
    prompt: "Deploy to PRODUCTION? This will modify production servers."

  verify:prod:
    desc: Verify production Kafka cluster
    vars:
      INVENTORY: ./inventories/production/hosts.yml
    cmds:
      - uv run ansible-playbook -i {{.INVENTORY}} playbooks/verify.yml
    preconditions:
      - sh: "test -f {{.INVENTORY}}"
        msg: "Production inventory not found: {{.INVENTORY}}"

  verify:prod:single:
    desc: "Verify single production node (usage: task ansible:verify:prod:single -- kafka-1)"
    vars:
      INVENTORY: ./inventories/production/hosts.yml
    cmds:
      - uv run ansible-playbook -i {{.INVENTORY}} playbooks/verify.yml --limit {{.CLI_ARGS | default "kafka-1"}}
    preconditions:
      - sh: "test -f {{.INVENTORY}}"
        msg: "Production inventory not found: {{.INVENTORY}}"

  precheck:prod:
    desc: Run pre-flight checks on production VMs before deployment
    vars:
      INVENTORY: ./inventories/production/hosts.yml
    cmds:
      - uv run ansible-playbook -i {{.INVENTORY}} playbooks/precheck.yml
    preconditions:
      - sh: "test -f {{.INVENTORY}}"
        msg: "Production inventory not found: {{.INVENTORY}}"
