# Monitoring Stack - Source of Truth
# Convert to Quadlet: podlets compose monitoring/compose.yaml
name: monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  victoriametrics-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/monitoring/victoriametrics
  loki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/monitoring/loki
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/monitoring/grafana

services:
  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.113.0
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics-data:/storage
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
    networks:
      - monitoring
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.4.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
    command:
      - "-config.file=/etc/loki/config.yaml"
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.5.2
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring
    restart: unless-stopped

  alloy:
    image: docker.io/grafana/alloy:v1.6.1
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
    networks:
      - monitoring
    restart: unless-stopped
    pid: host
