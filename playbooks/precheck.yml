---
# Pre-flight check playbook for Kafka production deployment
# Run with: ansible-playbook -i inventory playbooks/precheck.yml
#
# This playbook runs ALL checks and generates a report even if some fail.
# The playbook fails at the end if any check failed.

#######################################
# Play 1: Individual Node Checks
#######################################
- name: Pre-flight Node Validation
  hosts: kafka
  become: true
  gather_facts: true

  vars:
    required_os: "Ubuntu"
    required_os_version: "24.04"
    required_arch: "aarch64"
    min_vcpus: 8
    min_memory_mb: 15360
    min_disk_gb: 2000
    kafka_ports:
      - 9092
      - 9093

  tasks:
    - name: Initialize check results
      ansible.builtin.set_fact:
        check_results: {}
        checks_failed: false

    #######################################
    # OS and Architecture Validation
    #######################################
    - name: Check OS distribution
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'os_distribution': {
              'status': 'PASS' if ansible_distribution == required_os else 'FAIL',
              'expected': required_os,
              'actual': ansible_distribution
            }
          }) }}

    - name: Check OS version
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'os_version': {
              'status': 'PASS' if ansible_distribution_version == required_os_version else 'FAIL',
              'expected': required_os_version,
              'actual': ansible_distribution_version
            }
          }) }}

    - name: Check architecture
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'architecture': {
              'status': 'PASS' if ansible_architecture == required_arch else 'FAIL',
              'expected': required_arch,
              'actual': ansible_architecture
            }
          }) }}

    #######################################
    # Resource Validation
    #######################################
    - name: Check CPU cores
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'cpu_cores': {
              'status': 'PASS' if ansible_processor_vcpus >= min_vcpus else 'FAIL',
              'minimum': min_vcpus,
              'actual': ansible_processor_vcpus
            }
          }) }}

    - name: Check memory
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'memory': {
              'status': 'PASS' if ansible_memtotal_mb >= min_memory_mb else 'FAIL',
              'minimum_gb': (min_memory_mb / 1024) | round(1),
              'actual_gb': (ansible_memtotal_mb / 1024) | round(1)
            }
          }) }}

    #######################################
    # Disk Layout and Space Validation
    #######################################
    - name: Get fstab contents
      ansible.builtin.slurp:
        src: /etc/fstab
      register: fstab_content

    - name: Get mount points and available space
      ansible.builtin.shell:
        cmd: set -o pipefail; df -BG --output=target,size,avail,fstype | grep -v tmpfs | grep -v udev
        executable: /bin/bash
      register: disk_space
      changed_when: false

    - name: Get largest available disk space in GB
      ansible.builtin.shell:
        cmd: set -o pipefail; df -BG --output=avail | tail -n +2 | sed 's/G//' | sort -rn | head -1
        executable: /bin/bash
      register: max_disk_avail
      changed_when: false

    - name: Check disk space
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'disk_space': {
              'status': 'PASS' if (max_disk_avail.stdout | trim | int) >= min_disk_gb else 'FAIL',
              'minimum_gb': min_disk_gb,
              'actual_gb': max_disk_avail.stdout | trim
            }
          }) }}

    #######################################
    # Firewall Validation
    #######################################
    - name: Check if UFW is installed
      ansible.builtin.command:
        cmd: which ufw
      register: ufw_installed
      failed_when: false
      changed_when: false

    - name: Get UFW status
      ansible.builtin.command:
        cmd: ufw status
      register: ufw_status
      when: ufw_installed.rc == 0
      changed_when: false

    - name: Check firewall status
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'firewall': {
              'status': 'PASS',
              'ufw_installed': ufw_installed.rc == 0,
              'ufw_status': ufw_status.stdout | default('UFW not installed')
            }
          }) }}

    #######################################
    # APT Package Availability
    #######################################
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Check if OpenJDK 21 is available
      ansible.builtin.command:
        cmd: apt-cache policy openjdk-21-jdk-headless
      register: java_package_check
      changed_when: false

    - name: Evaluate OpenJDK availability
      ansible.builtin.set_fact:
        java_available: "{{ 'Candidate:' in java_package_check.stdout and 'Candidate: (none)' not in java_package_check.stdout }}"

    - name: Record APT package check
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'apt_openjdk21': {
              'status': 'PASS' if java_available else 'FAIL',
              'available': java_available,
              'details': java_package_check.stdout
            }
          }) }}

    #######################################
    # Download URL Verification
    #######################################
    - name: Define download URLs
      ansible.builtin.set_fact:
        kafka_version: "4.1.1"
        kafka_scala_version: "2.13"
        jmx_exporter_version: "1.0.1"
        kafka_exporter_version: "1.8.0"

    - name: Set Kafka download URL
      ansible.builtin.set_fact:
        kafka_download_url: >-
          https://downloads.apache.org/kafka/{{ kafka_version }}/kafka_{{
          kafka_scala_version }}-{{ kafka_version }}.tgz

    - name: Set JMX Exporter download URL
      ansible.builtin.set_fact:
        jmx_exporter_url: >-
          https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/{{
          jmx_exporter_version }}/jmx_prometheus_javaagent-{{ jmx_exporter_version }}.jar

    - name: Set Kafka Exporter download URL
      ansible.builtin.set_fact:
        kafka_exporter_url: >-
          https://github.com/danielqsj/kafka_exporter/releases/download/v{{
          kafka_exporter_version }}/kafka_exporter-{{ kafka_exporter_version }}.linux-arm64.tar.gz

    - name: Check Kafka download URL is reachable
      ansible.builtin.uri:
        url: "{{ kafka_download_url }}"
        method: HEAD
        timeout: 30
      register: kafka_url_check
      failed_when: false

    - name: Record Kafka URL check
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'download_kafka': {
              'status': 'PASS' if kafka_url_check.status == 200 else 'FAIL',
              'url': kafka_download_url,
              'http_status': kafka_url_check.status | default('N/A')
            }
          }) }}

    - name: Check JMX Exporter download URL is reachable
      ansible.builtin.uri:
        url: "{{ jmx_exporter_url }}"
        method: HEAD
        timeout: 30
      register: jmx_url_check
      failed_when: false

    - name: Record JMX Exporter URL check
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'download_jmx_exporter': {
              'status': 'PASS' if jmx_url_check.status == 200 else 'FAIL',
              'url': jmx_exporter_url,
              'http_status': jmx_url_check.status | default('N/A')
            }
          }) }}

    - name: Check Kafka Exporter download URL is reachable
      ansible.builtin.uri:
        url: "{{ kafka_exporter_url }}"
        method: HEAD
        timeout: 30
        follow_redirects: all
      register: kafka_exp_url_check
      failed_when: false

    - name: Record Kafka Exporter URL check
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'download_kafka_exporter': {
              'status': 'PASS' if kafka_exp_url_check.status == 200 else 'FAIL',
              'url': kafka_exporter_url,
              'http_status': kafka_exp_url_check.status | default('N/A')
            }
          }) }}

    #######################################
    # Kafka Binary Download Test
    #######################################
    - name: Create temp directory for Kafka download test
      ansible.builtin.tempfile:
        state: directory
        prefix: kafka_precheck_
      register: temp_dir
      when: kafka_url_check.status == 200

    - name: Download Kafka binary for verification
      ansible.builtin.get_url:
        url: "{{ kafka_download_url }}"
        dest: "{{ temp_dir.path }}/kafka.tgz"
        timeout: 120
        mode: "0644"
      register: kafka_download
      when: kafka_url_check.status == 200
      failed_when: false

    - name: Extract Kafka binary
      ansible.builtin.unarchive:
        src: "{{ temp_dir.path }}/kafka.tgz"
        dest: "{{ temp_dir.path }}"
        remote_src: true
      when: kafka_url_check.status == 200 and kafka_download is not failed
      failed_when: false
      register: kafka_extract

    - name: Find kafka-server-start.sh for verification
      ansible.builtin.find:
        paths: "{{ temp_dir.path }}"
        patterns: "kafka-server-start.sh"
        recurse: true
      register: kafka_script
      when: kafka_url_check.status == 200 and kafka_extract is not failed

    - name: Record Kafka binary check
      ansible.builtin.set_fact:
        check_results: >-
          {{ check_results | combine({
            'kafka_binary': {
              'status': 'PASS' if (kafka_script.files | default([]) | length > 0) else 'FAIL',
              'downloaded': kafka_download is not failed,
              'extracted': kafka_extract is not failed,
              'scripts_found': kafka_script.files | default([]) | length
            }
          }) }}

    - name: Cleanup temp directory
      ansible.builtin.file:
        path: "{{ temp_dir.path }}"
        state: absent
      when: temp_dir.path is defined

    #######################################
    # Calculate Overall Status
    #######################################
    - name: Check if any tests failed
      ansible.builtin.set_fact:
        checks_failed: "{{ check_results.values() | selectattr('status', 'eq', 'FAIL') | list | length > 0 }}"

    - name: Count passed and failed checks
      ansible.builtin.set_fact:
        passed_count: "{{ check_results.values() | selectattr('status', 'eq', 'PASS') | list | length }}"
        failed_count: "{{ check_results.values() | selectattr('status', 'eq', 'FAIL') | list | length }}"

    #######################################
    # Generate Report
    #######################################
    - name: Set report timestamp
      ansible.builtin.set_fact:
        report_timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Build human-readable precheck report
      ansible.builtin.set_fact:
        precheck_report: |
          ================================================================================
          KAFKA PRE-FLIGHT CHECK REPORT
          ================================================================================
          Host:         {{ inventory_hostname }}
          Generated:    {{ report_timestamp }}
          Overall:      {{ 'PASSED' if not checks_failed else 'FAILED' }} ({{ passed_count }} passed, {{ failed_count }} failed)
          ================================================================================

          CHECK RESULTS
          --------------------------------------------------------------------------------
          {% for check_name, check_data in check_results.items() %}
          [{{ check_data.status }}] {{ check_name }}
          {% for key, value in check_data.items() if key != 'status' %}
              {{ key }}: {{ value }}
          {% endfor %}

          {% endfor %}

          SYSTEM INFORMATION
          --------------------------------------------------------------------------------
          OS:           {{ ansible_distribution }} {{ ansible_distribution_version }}
          Architecture: {{ ansible_architecture }}
          Kernel:       {{ ansible_kernel }}
          CPU Cores:    {{ ansible_processor_vcpus }}
          Memory:       {{ (ansible_memtotal_mb / 1024) | round(1) }}GB

          DISK LAYOUT (/etc/fstab)
          --------------------------------------------------------------------------------
          {{ fstab_content.content | b64decode }}
          MOUNT POINTS
          --------------------------------------------------------------------------------
          {{ disk_space.stdout }}

          REQUIREMENTS
          --------------------------------------------------------------------------------
          Minimum vCPUs:     {{ min_vcpus }}
          Minimum Memory:    {{ (min_memory_mb / 1024) | round(1) }}GB
          Minimum Disk:      {{ min_disk_gb }}GB
          Required OS:       {{ required_os }} {{ required_os_version }}
          Required Arch:     {{ required_arch }}

          ================================================================================
          END OF REPORT
          ================================================================================

    - name: Save report to remote node
      ansible.builtin.copy:
        content: "{{ precheck_report }}"
        dest: "/tmp/precheck-report-{{ inventory_hostname }}.txt"
        mode: "0644"

    #######################################
    # Node Check Summary
    #######################################
    - name: Node pre-flight check summary
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "Pre-flight Check: {{ inventory_hostname }}"
          - "========================================"
          - "Status: {{ 'PASSED' if not checks_failed else 'FAILED' }}"
          - "Passed: {{ passed_count }} | Failed: {{ failed_count }}"
          - "Report: /tmp/precheck-report-{{ inventory_hostname }}.txt"
          - "========================================"

#######################################
# Play 2: Cluster Connectivity Checks
#######################################
- name: Pre-flight Cluster Connectivity
  hosts: kafka[0]
  become: true
  gather_facts: false

  tasks:
    - name: Get list of all Kafka hosts
      ansible.builtin.set_fact:
        kafka_hosts: "{{ groups['kafka'] }}"

    - name: Get other Kafka hosts (excluding self)
      ansible.builtin.set_fact:
        other_kafka_hosts: "{{ groups['kafka'] | difference([inventory_hostname]) }}"

    - name: Debug - Testing connectivity to other nodes
      ansible.builtin.debug:
        msg: "Testing connectivity from {{ inventory_hostname }} to: {{ other_kafka_hosts | join(', ') }}"

    - name: Test ping connectivity to other Kafka nodes
      ansible.builtin.command:
        cmd: "ping -c 2 -W 5 {{ item }}"
      loop: "{{ other_kafka_hosts }}"
      register: ping_results
      failed_when: false
      changed_when: false

    - name: Display ping results
      ansible.builtin.debug:
        msg: "Ping {{ item.item }}: {{ 'OK' if item.rc == 0 else 'FAILED' }}"
      loop: "{{ ping_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Test SSH connectivity to other Kafka nodes
      ansible.builtin.command:
        cmd: "ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no {{ item }} echo 'SSH OK'"
      loop: "{{ other_kafka_hosts }}"
      register: ssh_results
      failed_when: false
      changed_when: false
      become: false

    - name: Display SSH results
      ansible.builtin.debug:
        msg: "SSH {{ item.item }}: {{ 'OK' if item.rc == 0 else 'FAILED' }}"
      loop: "{{ ssh_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Cluster connectivity summary
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "Cluster Connectivity Check Complete"
          - "========================================"

#######################################
# Play 3: Fetch Reports to Local
#######################################
- name: Fetch Precheck Reports
  hosts: kafka
  become: true
  gather_facts: false

  tasks:
    - name: Ensure local reports directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports/precheck"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Fetch precheck report from each node
      ansible.builtin.fetch:
        src: "/tmp/precheck-report-{{ inventory_hostname }}.txt"
        dest: "{{ playbook_dir }}/../reports/precheck/"
        flat: true

    - name: Display report location
      ansible.builtin.debug:
        msg: "Report saved to: reports/precheck/precheck-report-{{ inventory_hostname }}.txt"

#######################################
# Play 4: Final Status Check
#######################################
- name: Final Pre-flight Status
  hosts: kafka
  become: false
  gather_facts: false

  tasks:
    - name: Fail if any node had check failures
      ansible.builtin.fail:
        msg: "Pre-flight checks failed on {{ inventory_hostname }}. See report: reports/precheck/precheck-report-{{ inventory_hostname }}.txt"
      when: checks_failed | default(false)
